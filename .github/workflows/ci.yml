name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            $(python3 tools/build/verify_dependencies.py apt-arguments --include-ci)

      - name: Verify dependency lock
        run: python3 tools/build/verify_dependencies.py verify --source-root . --include-ci

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel 2

      - name: Test
        run: |
          mkdir -p build/dev/Testing
          xvfb-run -a ctest --preset dev --output-on-failure \
            --output-junit build/dev/Testing/junit.xml

      - name: Retain CTest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-1-ctest
          path: |
            build/dev/Testing/junit.xml
            build/dev/Testing/Temporary/LastTest.log
          if-no-files-found: error
